# Default (local) configuration.
# Every value can be overridden with an environment variable (see .env.example).
spring:
  application:
    name: pulse
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${SPRING_DATASOURCE_USERNAME:pulse}
    password: ${SPRING_DATASOURCE_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      # The schema comes only from Flyway migrations; Hibernate only checks it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    # Sessions live in Postgres. Flyway creates the tables (V3), so never let Spring do it.
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Log out after 8 hours without any request (no remember-me).
      timeout: 8h
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        path: /
        # Local runs on plain http. The prod profile sets this to true.
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Shared secret the Vercel route handler sends as the X-Pulse-Proxy-Secret header.
  # Empty = the check is off (local dev only; the prod profile requires it).
  proxy-secret: ${APP_PROXY_SECRET:}
  require-proxy-secret: false
  # The website. Links in emails point here (e.g. <frontend-url>/verify-email?token=...),
  # and its host is the passkey RP ID.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:Pulse <no-reply@localhost>}
    # Empty = emails are only printed to the console (local dev).
    resend-api-key: ${RESEND_API_KEY:}
    require-resend: false
    # Send on a background thread, after the database commit.
    async: true
  auth:
    verify-ttl: 24h
    reset-ttl: 1h
    # Login: after this many failed tries for one email + IP, block it for the lock time.
    # Also used for passkey login (per IP) and change password (per user).
    login-max-failures: 5
    login-lock-time: 15m
    # Forgot password: at most this many emails per email + IP in the window.
    forgot-password-max-requests: 3
    forgot-password-window: 15m
    # Register: at most this many per IP in the window (then 429).
    register-max-per-ip: 10
    register-window: 1h
    # Verification emails (register + resend): at most this many per email + IP.
    verify-mail-max-requests: 3
    verify-mail-window: 15m
    # Every auth email to one address, from any IP.
    mail-per-email-max: 5
    mail-per-email-window: 1h
